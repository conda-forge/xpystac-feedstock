{% set python_min = "3.11" %}
{% set name = "xpystac" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/xpystac-{{ version }}.tar.gz
  sha256: 8001333dc1d7e1d8556b5418e6902d675aa4bc9bcf646474833829173298a4cb

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - setuptools-scm >=6.2
    - pip
  run:
    - python >={{ python_min }}
    - xarray
    - pystac >=1.0.1

test:
  imports:
    - xpystac
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/stac-utils/xpystac
  summary: Extend xarray.open_dataset to accept pystac objects
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jsignell
